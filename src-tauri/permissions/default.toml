[[permission]]
identifier = "allow-app-commands"
description = "Allows the app's own commands for local windows."
commands.allow = [
  "resize_titlebar",
  "set_chat_zoom",
  "get_chat_zoom",
  "simulate_shortcut",
  "focus_chat",
  "show_devtools",
  "logout",
  "check_logged_in",
  "show_downloads",
  "open_download",
  "set_theme",
  "set_backdrop_blur",
  "set_global_theme",
  "get_global_theme",
  "set_window_narrow",
  "set_sidebar_state",
  "get_auto_updates",
  "set_auto_updates",
  "get_tray_mode",
  "set_tray_mode",
]
