[package]
name = "mesa"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` gates WindowBuilder and child webviews, which the whole
# titlebar + chat layout is built on.
tauri = { version = "2", features = ["unstable", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.7.1"

[target.'cfg(target_os = "windows")'.dependencies]
jpeg-decoder = "0.3"
windows = { version = "0.61", features = ["Win32_Graphics_Gdi"] }

